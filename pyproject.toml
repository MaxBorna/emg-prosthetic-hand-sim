[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handsim"
version = "0.0.1"
description = "Simulation-first EMG-controlled underactuated prosthetic hand (MuJoCo + NinaPro)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "pandas>=2.1", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.4", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
